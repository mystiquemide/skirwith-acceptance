# Trusted Skirwith settlement workflow for the acceptance repository.
# Runs only on closed, merged pull requests; never checks out PR code.

name: Skirwith settlement

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: skirwith-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  settle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: mystiquemide/skirwith@dc705c96e5ff098edbaa9e42c19437cd2d2c8fc6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEPERHUB_API_KEY: ${{ secrets.KEEPERHUB_API_KEY }}
          SKIRWITH_RECEIPT_SECRET: ${{ secrets.SKIRWITH_RECEIPT_SECRET }}
          # Fallback for authenticated pre-rebrand receipts preserved in this repo.
          MERGE_PAY_RECEIPT_SECRET: ${{ secrets.MERGE_PAY_RECEIPT_SECRET }}

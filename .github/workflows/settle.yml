# Trusted MergePay settlement workflow for the acceptance repository.
# Runs only on closed, merged pull requests; never checks out PR code.

name: MergePay settlement

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: mergepay-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  settle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: mystiquemide/skirwith@d75ca5398e4c78083336e6f6fbb2858e2f1ee785
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEPERHUB_API_KEY: ${{ secrets.KEEPERHUB_API_KEY }}
          MERGE_PAY_RECEIPT_SECRET: ${{ secrets.MERGE_PAY_RECEIPT_SECRET }}
